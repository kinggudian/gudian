<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국가기술자격 CBT 스마트 모의고사</title>
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .bottom-sheet.closed { transform: translateY(calc(100% - 56px)); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded">CBT TEST</span>
        <h1 id="exam-title" class="text-base sm:text-lg font-bold truncate max-w-[180px] sm:max-w-xs md:max-w-md">
          과목/회차를 선택해주세요
        </h1>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-4">
        <div id="timer-box" class="hidden items-center bg-slate-800 border border-slate-700 px-3 py-1 rounded text-amber-400 font-mono text-sm sm:text-base font-bold">
          <i data-lucide="clock" class="w-4 h-4 mr-1.5 animate-pulse"></i>
          <span id="time-display">60:00</span>
        </div>
        
        <button id="submit-btn" onclick="submitExam()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold px-3 py-1.5 rounded transition">
          제출하기
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 md:p-6 flex flex-col md:flex-row gap-4 mb-16 md:mb-0">
    
    <!-- LEFT PANEL: SETUP / QUESTION DISPLAY -->
    <section class="flex-1 bg-white rounded-lg shadow-sm border border-slate-200 flex flex-col overflow-hidden min-h-[500px]">
      
      <!-- STEP 1: SELECTOR & PDF UPLOADER -->
      <div id="setup-view" class="p-6 space-y-6 my-auto max-w-2xl mx-auto w-full">
        <div class="text-center space-y-2">
          <h2 class="text-2xl font-extrabold text-slate-900">CBT 모의고사 시험장</h2>
          <p class="text-sm text-slate-500">원하시는 과목 및 회차를 선택하거나 PDF 시험지를 업로드하세요.</p>
        </div>

        <!-- Dropdowns -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">1. 과목 선택</label>
            <select id="subject-select" onchange="onSubjectChange()" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">-- 목록 불러오는 중... --</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">2. 시험 회차 선택</label>
            <select id="date-select" class="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="">-- 회차를 선택하세요 --</option>
            </select>
          </div>

          <button onclick="startExamFromSelect()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md flex items-center justify-center space-x-2">
            <i data-lucide="play-circle" class="w-5 h-5"></i>
            <span>선택한 회차로 시험 시작</span>
          </button>
        </div>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-4 text-xs font-semibold text-slate-400">또는 내 PC의 PDF 파일 업로드</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- File Upload Area -->
        <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-blue-500 bg-slate-50 rounded-xl p-6 text-center cursor-pointer transition">
          <input type="file" id="pdf-input" accept=".pdf" class="hidden" onchange="handleFileUpload(event)">
          <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 mx-auto mb-2"></i>
          <p class="text-sm font-semibold text-slate-700">PDF 파일을 여기에 드래그하거나 클릭하여 선택</p>
          <p class="text-xs text-slate-400 mt-1">예: <span class="font-mono text-slate-600">산업안전보건기준_260922.pdf</span></p>
        </div>
      </div>

      <!-- STEP 2: ACTIVE QUESTION VIEW -->
      <div id="exam-view" class="hidden flex-1 flex flex-col h-full">
        <!-- Question Header Nav -->
        <div class="bg-slate-50 border-b border-slate-200 p-3 sm:p-4 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <span id="q-number" class="bg-slate-900 text-white font-bold text-sm px-2.5 py-1 rounded">Q1</span>
            <span id="q-type" class="text-xs text-blue-600 font-semibold">[객관식]</span>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="prevQuestion()" class="p-1.5 rounded hover:bg-slate-200 border border-slate-300">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <span id="q-progress" class="text-xs font-bold text-slate-600">1 / 30</span>
            <button onclick="nextQuestion()" class="p-1.5 rounded hover:bg-slate-200 border border-slate-300">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <!-- Question Body -->
        <div class="flex-1 p-4 sm:p-6 overflow-y-auto custom-scrollbar space-y-6">
          <div id="q-text" class="text-base sm:text-lg font-medium text-slate-900 leading-relaxed whitespace-pre-line">
            문제를 불러오는 중입니다...
          </div>

          <div id="q-options" class="space-y-3 pt-2"></div>

          <div id="solution-box" class="hidden mt-6 bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm">
            <div class="font-bold text-slate-800 mb-1 flex items-center space-x-1">
              <i data-lucide="book-open" class="w-4 h-4 text-blue-600"></i>
              <span>정답 및 해설</span>
            </div>
            <div id="correct-ans" class="text-blue-600 font-bold mb-2">정답: ①</div>
            <div id="explanation-text" class="text-slate-600 whitespace-pre-line leading-relaxed">해설 정보가 없습니다.</div>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: OMR SHEET -->
    <aside id="omr-container" class="hidden md:block w-full md:w-80 bg-white rounded-lg shadow-sm border border-slate-200 flex flex-col overflow-hidden">
      <div class="bg-slate-900 text-white p-3.5 font-bold text-sm flex items-center justify-between">
        <span class="flex items-center space-x-2">
          <i data-lucide="check-square" class="w-4 h-4 text-blue-400"></i>
          <span>OMR 답안지</span>
        </span>
        <span id="omr-count" class="text-xs font-normal text-slate-400">마킹 0 / 30</span>
      </div>

      <div id="omr-grid" class="flex-1 p-3 overflow-y-auto custom-scrollbar space-y-2 max-h-[500px] md:max-h-none"></div>
    </aside>

  </main>

  <!-- MOBILE BOTTOM SHEET OMR -->
  <div id="mobile-omr-drawer" class="fixed inset-x-0 bottom-0 bg-white border-t border-slate-300 shadow-2xl z-30 md:hidden bottom-sheet closed">
    <button onclick="toggleMobileOMR()" class="w-full bg-slate-800 text-white px-4 py-3 flex items-center justify-between font-bold text-sm">
      <span class="flex items-center space-x-2">
        <i data-lucide="check-circle" class="w-4 h-4 text-blue-400"></i>
        <span>OMR 답안지 펼치기 / 접기</span>
      </span>
      <i id="omr-chevron" data-lucide="chevron-up" class="w-5 h-5 transition-transform"></i>
    </button>
    <div id="mobile-omr-content" class="p-3 max-h-64 overflow-y-auto custom-scrollbar"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let examData = [];
    let userAnswers = {};
    let currentIndex = 0;
    let timerInterval = null;
    let totalSeconds = 3600;
    let isSubmitted = false;
    let availableExams = [];

    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      setupDragAndDrop();
      await fetchExamIndex();
    });

    // exams.json, EXAM.json 등 대소문자 캐시 방지 시도
    async function fetchExamIndex() {
      const possiblePaths = ['exams.json', 'EXAM.json', 'Exams.json'];
      let loaded = false;

      for (const path of possiblePaths) {
        try {
          // 캐시 방지를 위해 timestamp 붙임
          const res = await fetch(`${path}?v=${new Date().getTime()}`);
          if (res.ok) {
            availableExams = await res.json();
            populateSubjectDropdown();
            loaded = true;
            break;
          }
        } catch (e) {
          console.warn(`${path} 탐색 실패`);
        }
      }

      if (!loaded) {
        document.getElementById('subject-select').innerHTML = '<option value="">-- 등록된 시험이 없습니다 (PDF 업로드 필요) --</option>';
      }
    }

    function populateSubjectDropdown() {
      const subjectSelect = document.getElementById('subject-select');
      if (!availableExams || availableExams.length === 0) {
        subjectSelect.innerHTML = '<option value="">-- 등록된 과목이 없습니다 --</option>';
        return;
      }

      const subjects = [...new Set(availableExams.map(item => item.subject))];
      subjectSelect.innerHTML = '<option value="">-- 과목을 선택하세요 --</option>';
      subjects.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.textContent = sub;
        subjectSelect.appendChild(opt);
      });
    }

    function onSubjectChange() {
      const selectedSubject = document.getElementById('subject-select').value;
      const dateSelect = document.getElementById('date-select');
      dateSelect.innerHTML = '<option value="">-- 회차를 선택하세요 --</option>';

      const filtered = availableExams.filter(item => item.subject === selectedSubject);
      filtered.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.path;
        opt.textContent = `${item.date} 회차`;
        dateSelect.appendChild(opt);
      });
    }

    function setupDragAndDrop() {
      const zone = document.getElementById('drop-zone');
      const input = document.getElementById('pdf-input');

      zone.addEventListener('click', () => input.click());
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('border-blue-500'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('border-blue-500'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('border-blue-500');
        if (e.dataTransfer.files.length) parsePDFFile(e.dataTransfer.files[0]);
      });
    }

    function handleFileUpload(e) {
      if (e.target.files.length) parsePDFFile(e.target.files[0]);
    }

    async function startExamFromSelect() {
      const path = document.getElementById('date-select').value;
      if (!path) return alert('과목과 회차를 먼저 선택해 주세요.');
      
      try {
        const res = await fetch(`${path}?v=${new Date().getTime()}`);
        const blob = await res.blob();
        parsePDFFile(blob, path.split('/').pop());
      } catch (e) {
        alert('파일을 불러오는 중 오류가 발생했습니다.');
      }
    }

    async function parsePDFFile(file, overrideName) {
      const filename = overrideName || file.name || '산업안전보건기준_260922.pdf';
      parseFilenameInfo(filename);

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.0 });
        const textContent = await page.getTextContent();
        
        const midX = viewport.width / 2;
        let leftColumn = [];
        let rightColumn = [];

        textContent.items.forEach(item => {
          if (!item.str.trim()) return;
          const x = item.transform[4];
          if (x < midX) leftColumn.push(item);
          else rightColumn.push(item);
        });

        const sortY = (a, b) => b.transform[5] - a.transform[5];
        leftColumn.sort(sortY);
        rightColumn.sort(sortY);

        const pageText = leftColumn.map(i => i.str).join(' ') + '\n' + rightColumn.map(i => i.str).join(' ') + '\n';
        fullText += pageText;
      }

      const answerKeyMap = extractAnswerKeys(fullText);
      examData = extractQuestionsAdvanced(fullText, answerKeyMap);

      if (examData.length === 0) {
        alert('PDF 내 문제를 파싱하지 못하여 데모 문제로 대체합니다.');
        examData = getDemoQuestions();
      }

      initExam();
    }

    function parseFilenameInfo(filename) {
      const baseName = filename.replace('.pdf', '');
      const parts = baseName.split('_');
      const subject = parts[0] || '산업안전보건기준';
      let dateStr = parts[1] || '';

      if (dateStr.length === 6) {
        dateStr = `20${dateStr.substring(0,2)}년 ${dateStr.substring(2,4)}월 ${dateStr.substring(4,6)}일`;
      }

      document.getElementById('exam-title').textContent = `${subject} (${dateStr || '모의고사'})`;
    }

    function extractAnswerKeys(text) {
      const keys = {};
      const answerSection = text.match(/객관식 정답[\s\S]*?(?=단답형 정답|$)/);
      if (answerSection) {
        const matches = answerSection[0].matchAll(/(\d{2})\s*([①②③④1234])/g);
        for (const m of matches) {
          const num = parseInt(m[1]);
          const ansChar = m[2];
          let ansNum = 1;
          if (['①', '1'].includes(ansChar)) ansNum = 1;
          else if (['②', '2'].includes(ansChar)) ansNum = 2;
          else if (['③', '3'].includes(ansChar)) ansNum = 3;
          else if (['④', '4'].includes(ansChar)) ansNum = 4;
          keys[num] = ansNum;
        }
      }
      return keys;
    }

    function extractQuestionsAdvanced(text, answerKeys) {
      const questions = [];
      const regex = /(\d{2})\.\s*([\s\S]*?)(?=\n\d{2}\.|\n\[제|\n■|$)/g;
      let match;

      while ((match = regex.exec(text)) !== null) {
        const qNum = parseInt(match[1]);
        if (qNum > 30) continue;

        const block = match[2];
        const qTextMatch = block.match(/^([\s\S]*?)(?=[①②③④]|\b1\b|\b2\b|\b3\b|\b4\b)/);
        const questionText = qTextMatch ? qTextMatch[1].trim() : block.split('\n')[0];

        let options = [];
        const circleMatches = [...block.matchAll(/[①②③④1-4]\s*([^\n①②③④]+)/g)];
        if (circleMatches.length >= 4) {
          options = circleMatches.slice(0, 4).map(m => m[1].trim());
        } else {
          const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
          options = lines.slice(1, 5);
        }

        if (options.length < 4) {
          options = ["보기 1", "보기 2", "보기 3", "보기 4"];
        }

        questions.push({
          id: qNum,
          question: questionText,
          options: options.slice(0, 4),
          answer: answerKeys[qNum] || 2,
          explanation: `산업안전보건기준에 관한 규칙 제${qNum}조 관련 출제 항목입니다.`
        });
      }

      return questions;
    }

    function initExam() {
      document.getElementById('setup-view').classList.add('hidden');
      document.getElementById('exam-view').classList.remove('hidden');
      document.getElementById('omr-container').classList.remove('hidden');
      document.getElementById('timer-box').classList.remove('hidden');
      document.getElementById('timer-box').classList.add('flex');
      document.getElementById('submit-btn').classList.remove('hidden');

      currentIndex = 0;
      userAnswers = {};
      isSubmitted = false;

      renderQuestion();
      renderOMR();
      startTimer();
    }

    function renderQuestion() {
      const q = examData[currentIndex];
      document.getElementById('q-number').textContent = `Q${q.id || currentIndex + 1}`;
      document.getElementById('q-progress').textContent = `${currentIndex + 1} / ${examData.length}`;
      document.getElementById('q-text').textContent = q.question;

      const optsContainer = document.getElementById('q-options');
      optsContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const isSelected = userAnswers[currentIndex] === optNum;
        
        const btn = document.createElement('button');
        btn.onclick = () => selectAnswer(optNum);
        btn.className = `w-full text-left p-3.5 rounded-lg border transition flex items-center space-x-3 ${
          isSelected 
            ? 'bg-blue-50 border-blue-600 text-blue-900 font-semibold' 
            : 'bg-white border-slate-200 hover:bg-slate-50 text-slate-700'
        }`;

        btn.innerHTML = `
          <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs border ${
            isSelected ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300 text-slate-500'
          }">${optNum}</span>
          <span class="text-sm sm:text-base">${optText}</span>
        `;
        optsContainer.appendChild(btn);
      });

      const solBox = document.getElementById('solution-box');
      if (isSubmitted) {
        solBox.classList.remove('hidden');
        document.getElementById('correct-ans').textContent = `정답: ${getCircleNum(q.answer)}`;
        document.getElementById('explanation-text').textContent = q.explanation || "해설이 없습니다.";
      } else {
        solBox.classList.add('hidden');
      }
    }

    function selectAnswer(ansNum) {
      if (isSubmitted) return;
      userAnswers[currentIndex] = ansNum;
      renderQuestion();
      renderOMR();
    }

    function renderOMR() {
      const grid = document.getElementById('omr-grid');
      const mobileContent = document.getElementById('mobile-omr-content');
      grid.innerHTML = '';

      let markedCount = 0;

      examData.forEach((q, idx) => {
        if (userAnswers[idx]) markedCount++;

        const row = document.createElement('div');
        row.className = `flex items-center justify-between p-2 rounded hover:bg-slate-100 cursor-pointer text-xs ${
          currentIndex === idx ? 'bg-slate-100 font-bold' : ''
        }`;
        row.onclick = () => { currentIndex = idx; renderQuestion(); };

        let numButtonsHtml = '';
        [1, 2, 3, 4].forEach(num => {
          const isSel = userAnswers[idx] === num;
          numButtonsHtml += `
            <span class="w-6 h-6 rounded-full flex items-center justify-center font-mono ${
              isSel ? 'bg-slate-900 text-white font-bold' : 'bg-slate-200 text-slate-600'
            }">${num}</span>
          `;
        });

        row.innerHTML = `
          <span class="w-8">Q${idx + 1}</span>
          <div class="flex space-x-1.5">${numButtonsHtml}</div>
        `;
        grid.appendChild(row);
      });

      document.getElementById('omr-count').textContent = `마킹 ${markedCount} / ${examData.length}`;
      mobileContent.innerHTML = grid.innerHTML;
    }

    function prevQuestion() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); renderOMR(); }
    }
    function nextQuestion() {
      if (currentIndex < examData.length - 1) { currentIndex++; renderQuestion(); renderOMR(); }
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          alert('시험 시간이 종료되었습니다.');
          submitExam();
          return;
        }
        totalSeconds--;
        const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const s = (totalSeconds % 60).toString().padStart(2, '0');
        document.getElementById('time-display').textContent = `${m}:${s}`;
      }, 1000);
    }

    function submitExam() {
      if (!confirm('정말 답안을 제출하시겠습니까?')) return;
      
      clearInterval(timerInterval);
      isSubmitted = true;

      let score = 0;
      examData.forEach((q, idx) => {
        if (userAnswers[idx] === q.answer) score += (100 / examData.length);
      });

      alert(`시험 제출 완료!\n최종 점수: ${Math.round(score)}점 / 100점`);
      renderQuestion();
      renderOMR();
    }

    function toggleMobileOMR() {
      const drawer = document.getElementById('mobile-omr-drawer');
      const chevron = document.getElementById('omr-chevron');
      drawer.classList.toggle('closed');
      chevron.classList.toggle('rotate-180');
    }

    function getCircleNum(n) {
      return ['①', '②', '③', '④'][n - 1] || n;
    }

    function getDemoQuestions() {
      return [
        { id: 1, question: "가설통로 설치 시 준수해야 할 경사 기준으로 옳은 것은?", options: ["15도 이하", "30도 이하", "45도 이하", "60도 이하"], answer: 2, explanation: "제22조(가설통로의 구조) 경사 30도 이하" }
      ];
    }
  </script>
</body>
</html>
