name: Auto Generate Exams JSON for Vercel

on:
  push:
    paths:
      - 'pdfs/**'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate exams.json
        run: |
          node -e '
          const fs = require("fs");
          const pdfDir = "./pdfs";
          let pdfList = [];
          
          if (fs.existsSync(pdfDir)) {
            const files = fs.readdirSync(pdfDir);
            files.forEach(file => {
              if (file.endsWith(".pdf")) {
                const parts = file.replace(".pdf", "").split("_");
                const subject = parts[0] || "산업안전보건기준";
                const dateRaw = parts[1] || "";
                const roundRaw = parts[2] || "";
                const formattedDate = dateRaw.length === 6
                  ? `20${dateRaw.substring(0,2)}-${dateRaw.substring(2,4)}-${dateRaw.substring(4,6)}`
                  : "모의고사";
                // 같은 날짜에 여러 회차가 있으면(파일명 끝의 _N) 드롭다운에서 구분되도록 회차를 표시
                const roundSuffix = /^\d+$/.test(roundRaw) ? ` (${roundRaw}회차)` : "";

                pdfList.push({
                  filename: file,
                  subject: subject,
                  date: formattedDate + roundSuffix,
                  path: `pdfs/${file}`
                });
              }
            });
          }
          fs.writeFileSync("exams.json", JSON.stringify(pdfList, null, 2));
          console.log("exams.json generated:", pdfList);
          '

      - name: Commit and Push exams.json back to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exams.json
          git commit -m "chore: auto update exams.json [skip ci]" || exit 0
          git push origin main